name: Validate Windows and Linux contracts and simulation
on: [push, pull_request]
jobs:
  windows-validation:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r tools/requirements.txt
      - run: npm run verify
  linux-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: linux-vm/package-lock.json
      - run: npm ci
      - run: npm run verify
  linux-agent-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux-vm/agent
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build -j$(nproc)
      # No fio install here: none of these tests invoke a real fio process (they
      # exercise fio_arguments()/parse_fio_json() as pure functions, and
      # WorkloadController's own tests use a FakeEngine) -- this is a fake-adapter
      # test suite, not a hardware workload, per repo policy on CI.
      - run: ctest --test-dir build --output-on-failure
